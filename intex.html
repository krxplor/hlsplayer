<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.4"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
    width: 100%;
    height: 100%;
}

.player {
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
}

</style>

</head>

<body>

<div class="player">

<video
    id="video"
    controls
    playsinline
    webkit-playsinline
    preload="auto">
</video>

</div>


<script>

const video = document.getElementById("video");

const streamURL =
"https://2sisi.s3.us-east-2.amazonaws.com/bein2/master.m3u8";


if (Hls.isSupported()) {

    const hls = new Hls({

        enableWorker: true,

        lowLatencyMode: true,

        backBufferLength: 90,

        liveSyncDurationCount: 3,

        liveMaxLatencyDurationCount: 6,

        maxBufferLength: 30,

        maxMaxBufferLength: 60,

        capLevelToPlayerSize: true

    });


    hls.loadSource(streamURL);

    hls.attachMedia(video);


    hls.on(
        Hls.Events.MANIFEST_PARSED,
        function () {

            console.log("HLS stream loaded");

        }
    );


    hls.on(
        Hls.Events.ERROR,
        function (event, data) {

            console.log("HLS Error:", data);

            if (data.fatal) {

                if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ) {

                    hls.startLoad();

                }

                else if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ) {

                    hls.recoverMediaError();

                }

            }

        }
    );

}


/* Safari / iPhone */

else if (
    video.canPlayType(
        "application/vnd.apple.mpegurl"
    )
) {

    video.src = streamURL;

}

else {

    alert(
        "Your browser does not support HLS playback."
    );

}

</script>

</body>

</html>
