<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HLS Player</title>

<script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

</style>

</head>


<body>

<div id="player"></div>


<script>

/*
==================================================
GET HLS URL FROM ?url=
==================================================
*/

const params = new URLSearchParams(window.location.search);

const streamURL = params.get("url");


/*
==================================================
CHECK URL
==================================================
*/

if (!streamURL) {

    document.getElementById("player").innerHTML = `
        <div style="
            color:white;
            background:#000;
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            font-family:Arial,sans-serif;
        ">
            <div>
                <h3>No stream URL</h3>
                <p>Use ?url=YOUR-M3U8-URL</p>
            </div>
        </div>
    `;

}


/*
==================================================
START PLAYER
==================================================
*/

else {

    console.log("HLS URL:", streamURL);


    var player = jwplayer("player");


    player.setup({

        /*
        HLS STREAM
        */
        file: streamURL,

        type: "hls",

        /*
        HTML5 PLAYER
        */
        primary: "html5",

        /*
        AUTOPLAY
        */
        autostart: true,

        /*
        Start muted because many browsers
        block autoplay with sound.
        */
        mute: true,

        /*
        FULL SIZE
        */
        width: "100%",

        height: "100%",

        /*
        VIDEO DISPLAY
        */
        stretching: "uniform",

        /*
        LOAD METADATA FIRST
        */
        preload: "metadata",

        /*
        USE HLS.JS
        */
        hlsjsdefault: true,

        /*
        START WITH LOWER BANDWIDTH
        */
        defaultBandwidthEstimate: 400000,

        /*
        QUALITY MENU
        */
        qualityLabels: {
            "0": "Auto"
        },

        /*
        LIVE STREAM SETTINGS
        */
        liveTimeout: 60

    });


    /*
    ==================================================
    BUFFER EVENT
    ==================================================
    */

    player.on("buffer", function () {

        console.log("Buffering...");

    });


    /*
    ==================================================
    PLAY EVENT
    ==================================================
    */

    player.on("play", function () {

        console.log("Playing");

    });


    /*
    ==================================================
    ERROR RECOVERY
    ==================================================
    */

    player.on("error", function (error) {

        console.log("Player error:", error);

        setTimeout(function () {

            console.log("Reloading stream...");

            try {

                player.load([
                    {
                        file: streamURL,
                        type: "hls"
                    }
                ]);

                player.play();

            }

            catch (e) {

                console.log(
                    "Reload error:",
                    e
                );

            }

        }, 3000);

    });


    /*
    ==================================================
    STUCK STREAM DETECTION
    ==================================================
    */

    var lastTime = -1;

    var stuckCount = 0;


    setInterval(function () {

        try {

            var position = player.getPosition();


            /*
            Ignore invalid position
            */
            if (
                position === null ||
                position === undefined ||
                position < 0
            ) {

                return;

            }


            /*
            Check whether playback position
            has stopped moving.
            */

            if (position === lastTime) {

                stuckCount++;

                console.log(
                    "Player may be stuck:",
                    stuckCount
                );


                /*
                Require multiple checks before
                reloading to avoid unnecessary reloads.
                */

                if (stuckCount >= 2) {

                    console.log(
                        "Stuck detected - reloading..."
                    );


                    player.load([
                        {
                            file: streamURL,
                            type: "hls"
                        }
                    ]);


                    setTimeout(function () {

                        player.play();

                    }, 1000);


                    stuckCount = 0;

                }

            }

            else {

                stuckCount = 0;

            }


            lastTime = position;

        }

        catch (e) {

            console.log(
                "Position check error:",
                e
            );

        }

    }, 10000);

}

</script>

</body>

</html>
