<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.player {
    width: 100%;
    max-width: 1200px;
    background: #000;
    position: relative;
}

video {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;
    background: #000;
}

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-family: Arial, sans-serif;
    font-size: 15px;
    z-index: 5;
}

.error {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    width: 90%;
    z-index: 5;
}

</style>

</head>

<body>

<div class="player">

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="auto">
    </video>

    <div id="loading" class="loading">
        Loading...
    </div>

    <div id="error" class="error">
        Unable to load stream.
    </div>

</div>


<script>

const video = document.getElementById("video");
const loading = document.getElementById("loading");
const error = document.getElementById("error");


/*
    GET STREAM URL FROM:
    
    ?url=https://example.com/stream.m3u8
*/

const params = new URLSearchParams(window.location.search);

const streamURL = params.get("url");


if (!streamURL) {

    loading.style.display = "none";

    error.style.display = "block";

    error.innerHTML =
        "No HLS stream URL provided.<br><br>" +
        "Use ?url=YOUR-M3U8-URL";

}

else {

    console.log("Stream:", streamURL);


    /*
        HLS.JS
    */

    if (Hls.isSupported()) {

        const hls = new Hls({

            enableWorker: true,

            lowLatencyMode: true,

            backBufferLength: 90,

            liveSyncDurationCount: 3,

            liveMaxLatencyDurationCount: 6,

            maxBufferLength: 30,

            maxMaxBufferLength: 60,

            capLevelToPlayerSize: true

        });


        hls.loadSource(streamURL);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                console.log("HLS loaded");

                loading.style.display = "none";

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function (event, data) {

                console.log("HLS error:", data);


                if (data.fatal) {

                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {

                        console.log(
                            "Network error - retrying"
                        );

                        hls.startLoad();

                    }

                    else if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {

                        console.log(
                            "Media error - recovering"
                        );

                        hls.recoverMediaError();

                    }

                    else {

                        loading.style.display = "none";

                        error.style.display = "block";

                    }

                }

            }
        );

    }


    /*
        Safari / iPhone native HLS
    */

    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = streamURL;

        video.addEventListener(
            "loadedmetadata",
            function () {

                loading.style.display = "none";

            }
        );

    }


    else {

        loading.style.display = "none";

        error.style.display = "block";

        error.innerHTML =
            "Your browser does not support HLS.";

    }

}

</script>

</body>
</html>
