<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Live Player</title>

<script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

body {
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<div id="player"></div>

<script>

/* =========================================
   GET STREAM URL
   Example:
   ?url=https://example.com/live.m3u8
========================================= */

const params = new URLSearchParams(
    window.location.search
);

const streamURL = params.get("url");


/* =========================================
   NO URL
========================================= */

if (!streamURL) {

    document.getElementById("player").innerHTML = `
        <div style="
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#000;
            color:#fff;
            font-family:Arial;
            text-align:center;
        ">
            <div>
                <h3>No stream URL</h3>
                <p>Use ?url=YOUR-M3U8-URL</p>
            </div>
        </div>
    `;

}


/* =========================================
   PLAYER
========================================= */

else {

    console.log("Stream URL:");
    console.log(streamURL);


    let player = jwplayer("player");


    function loadStream() {

        console.log("Loading stream...");


        player.setup({

            file: streamURL,

            type: "hls",

            primary: "html5",

            width: "100%",

            height: "100%",

            aspectratio: "16:9",

            stretching: "uniform",

            controls: true,

            autostart: true,

            mute: true,

            preload: "metadata",

            /*
             * Use HLS.js where supported
             */
            hlsjsdefault: true,

            /*
             * Initial bandwidth estimate
             */
            defaultBandwidthEstimate: 400000,

            /*
             * Live manifest timeout
             */
            liveTimeout: 30,

            /*
             * Keep player close to live edge
             */
            liveSyncDuration: 10,

            /*
             * Quality menu
             */
            qualityLabels: {
                "0": "Auto"
            }

        });


        /* ==============================
           PLAYER READY
        ============================== */

        player.on("ready", function () {

            console.log("Player ready");

        });


        /* ==============================
           PLAY
        ============================== */

        player.on("play", function () {

            console.log("Playing");

        });


        /* ==============================
           BUFFER
        ============================== */

        player.on("buffer", function () {

            console.log("Buffering...");

        });


        /* ==============================
           ERROR
        ============================== */

        player.on("error", function (event) {

            console.log(
                "JW Player error:",
                event
            );


            /*
             * Don't reload immediately.
             * Wait 5 seconds.
             */

            setTimeout(function () {

                reloadPlayer();

            }, 5000);

        });


        /* ==============================
           SETUP ERROR
        ============================== */

        player.on("setupError", function (event) {

            console.log(
                "Setup error:",
                event
            );

        });

    }


    /* =========================================
       RELOAD PLAYER
    ========================================= */

    function reloadPlayer() {

        console.log(
            "Reloading HLS stream..."
        );


        try {

            player.remove();

        }

        catch (e) {

            console.log(e);

        }


        setTimeout(function () {

            player = jwplayer("player");

            loadStream();

        }, 1000);

    }


    /* =========================================
       START
    ========================================= */

    loadStream();


    /* =========================================
       STUCK DETECTION
    ========================================= */

    let lastPosition = -1;

    let stuckCounter = 0;


    setInterval(function () {

        try {

            if (!player) {
                return;
            }


            const state =
                player.getState();


            const position =
                player.getPosition();


            /*
             * Only check while playing/buffering
             */

            if (
                state === "playing" ||
                state === "buffering"
            ) {

                if (
                    position === lastPosition
                ) {

                    stuckCounter++;

                    console.log(
                        "Possible stuck stream:",
                        stuckCounter
                    );


                    /*
                     * 3 × 10 seconds
                     */

                    if (
                        stuckCounter >= 3
                    ) {

                        console.log(
                            "Stream stuck. Reloading..."
                        );

                        stuckCounter = 0;

                        reloadPlayer();

                    }

                }

                else {

                    stuckCounter = 0;

                }

            }


            lastPosition = position;

        }

        catch (e) {

            console.log(
                "Stuck check error:",
                e
            );

        }

    }, 10000);

}

</script>

</body>

</html>
