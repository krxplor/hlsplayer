
<script src="https://content.jwplatform.com/libraries/SAHhwvZq.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: black;
}
#player {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>
<div id="player"></div>
<script>
var streamURL = "https://live2.jorvakstreamcache.com/live/channel1.m3u8";
var player = jwplayer("player");
player.setup({
    file: streamURL,
    type: "hls",
    primary: "html5",

    autostart: true,
    mute: true,

    width: "100%",
    height: "100%",
    stretching: "fill",

    preload: "metadata",

    // 🔥 penting: pakai engine hls.js biar adaptif
    hlsjsdefault: true,

    // 🔥 lebih cepat pilih kualitas rendah dulu
    defaultBandwidthEstimate: 400000,

    // 🔥 UI kualitas
    qualityLabels: {
        "0": "Auto"
    },

    logo: {
        file: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgwNjkZYfLmvB5B8kULLicWE_vxUwbzPqjBVUjdrPvYl9fLW9w7-B5hxUEYc7ODWXUe4AKv0nOaXS44bwmahu7V_jDyCzVsvU5yEp9DOEy3v34Dp1xzZs7Z2sHtrjJKeOdXh7W27W7zmOyCVFOulpSzOo-bn5SYATZlOO4w9XKgnPGciR0pBEgnvRmn-amC/s1600/86dec2e2-dccd-44ce-9491-418b3d79c4db.png",
        link: "https://biolinku.co/rimbatv",
        position: "top-right"
    }
});
// 🔥 AUTO FIX BUFFERING
player.on('buffer', function() {
    console.log("Buffering...");
});
// 🔥 kalau error &#8594; reload
player.on('error', function() {
    console.log("Error, reload...");
    setTimeout(function() {
        player.load([{ file: streamURL }]);
        player.play();
    }, 3000);
});
// 🔥 kalau stuck lama &#8594; reload
var lastTime = 0;
setInterval(function() {
    var position = player.getPosition();

    if (position === lastTime) {
        console.log("Stuck detected, reload...");
        player.load([{ file: streamURL }]);
        player.play();
    }

    lastTime = position;
}, 10000);
</script>
